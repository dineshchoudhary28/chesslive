<!DOCTYPE html>
<html lang="en">
    <head>
        {{> head}}
        <title>Profile - ChessLive</title>
    </head>
    <body class="bg-gray">
        <div class="container">
            <div class="row">
                <div class="col-md-8 offset-md-2">
                    <div class="card mt-5">
                        <div class="card-header d-flex justify-content-between align-items-center">
                            <h2>User Profile</h2>
                            <a href="/lobby" class="btn btn-secondary">Back to Lobby</a>
                        </div>
                        <div class="card-body">
                            <div class="row">
                                <div class="col-md-4 text-center">
                                    <div class="profile-avatar mb-3">
                                        <div class="user-avatar">
                                            <span id="profileInitial"></span>
                                        </div>
                                    </div>
                                    <h4 id="profileUsername"></h4>
                                </div>
                                <div class="col-md-8">
                                    <form id="profileForm">
                                        <div class="form-group mb-3">
                                            <label for="username">Username</label>
                                            <input type="text" id="username" class="form-control" readonly>
                                        </div>
                                        <div class="form-group mb-3">
                                            <label for="email">Email</label>
                                            <input type="email" id="email" class="form-control">
                                        </div>
                                        <div class="form-group mb-3">
                                            <label for="currentPassword">Current Password</label>
                                            <input type="password" id="currentPassword" class="form-control" placeholder="Enter current password to make changes">
                                        </div>
                                        <div class="form-group mb-3">
                                            <label for="newPassword">New Password (optional)</label>
                                            <input type="password" id="newPassword" class="form-control" placeholder="Leave blank to keep current password">
                                        </div>
                                        <div class="form-group mb-3">
                                            <label for="confirmNewPassword">Confirm New Password</label>
                                            <input type="password" id="confirmNewPassword" class="form-control" placeholder="Confirm new password">
                                        </div>
                                        <button type="submit" class="btn btn-primary">Update Profile</button>
                                    </form>
                                    
                                    <div class="alert alert-danger mt-3 d-none" id="errorMessage"></div>
                                    <div class="alert alert-success mt-3 d-none" id="successMessage"></div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <style>
            .user-avatar {
                width: 100px;
                height: 100px;
                border-radius: 50%;
                background-color: #007bff;
                color: white;
                display: flex;
                align-items: center;
                justify-content: center;
                font-size: 36px;
                font-weight: bold;
                margin: 0 auto;
                border: 4px solid #0056b3;
            }
            
            .profile-avatar {
                margin-bottom: 20px;
            }
        </style>

        <script>
            $(document).ready(function() {
                // Check if user is logged in
                const username = sessionStorage.getItem('username');
                if (!username) {
                    window.location.href = '/';
                    return;
                }
                
                // Set profile info
                $('#profileUsername').text(username);
                $('#profileInitial').text(username.charAt(0).toUpperCase());
                $('#username').val(username);
                
                // Load user profile data
                socket.emit('getProfile', { username });
                
                // Handle profile form submission
                $('#profileForm').on('submit', function(e) {
                    e.preventDefault();
                    
                    const email = $('#email').val().trim();
                    const currentPassword = $('#currentPassword').val();
                    const newPassword = $('#newPassword').val();
                    const confirmNewPassword = $('#confirmNewPassword').val();
                    
                    // Hide previous messages
                    $('#errorMessage, #successMessage').addClass('d-none');
                    
                    // Validation
                    if (!email || !currentPassword) {
                        $('#errorMessage').text('Email and current password are required.').removeClass('d-none');
                        return;
                    }
                    
                    if (newPassword && newPassword !== confirmNewPassword) {
                        $('#errorMessage').text('New passwords do not match.').removeClass('d-none');
                        return;
                    }
                    
                    if (newPassword && newPassword.length < 6) {
                        $('#errorMessage').text('New password must be at least 6 characters long.').removeClass('d-none');
                        return;
                    }
                    
                    // Send update request
                    socket.emit('updateProfile', {
                        username,
                        email,
                        currentPassword,
                        newPassword: newPassword || null
                    });
                });
                
                // Handle profile data response
                socket.on('profileData', function(data) {
                    $('#email').val(data.email || '');
                });
                
                // Handle profile update success
                socket.on('profileUpdateSuccess', function(data) {
                    $('#successMessage').text('Profile updated successfully!').removeClass('d-none');
                    $('#currentPassword').val('');
                    $('#newPassword').val('');
                    $('#confirmNewPassword').val('');
                });
                
                // Handle profile update failure
                socket.on('profileUpdateFailed', function(data) {
                    $('#errorMessage').text(data.message || 'Failed to update profile.').removeClass('d-none');
                });
            });
        </script>
    </body>
</html>
