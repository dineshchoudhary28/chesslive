<!DOCTYPE html>
<html lang="en">
    <head>
        {{> head}}
        <title>ChessLive</title>
    </head>
    <body class="bg-gray">
        <div class="container">
            <div class="login-container">
                <div class="card">
                    <div class="card-header">
                        <h2>ChessLive</h2>
                    </div>
                    <div class="card-body">
                        <form id="loginForm">
                            <div class="form-group">
                                <label for="username">Username</label>
                                <input type="text" id="username" class="form-control" required placeholder="Enter your username">
                            </div>
                            <div class="form-group">
                                <label for="password">Password</label>
                                <input type="password" id="password" class="form-control" required placeholder="Enter your password">
                            </div>
                            <button type="submit" class="btn btn-primary btn-block">Login</button>
                        </form>
                        <div class="text-center mt-3">
                            <p>Don't have an account? <a href="/register">Register here</a></p>
                        </div>
                        <div class="alert alert-danger mt-3 d-none" id="errorMessage"></div>
                    </div>
                </div>
            </div>
        </div>

        <script>
            $(document).ready(function() {
                $('#loginForm').on('submit', function(e) {
                    e.preventDefault();
                    const username = $('#username').val().trim();
                    const password = $('#password').val();
                    
                    if (!username || !password) return;

                    // Send login data to server
                    socket.emit('login', { username, password });
                });

                // Handle successful login
                socket.on('loginSuccess', function(data) {
                    // Store username in session storage
                    sessionStorage.setItem('username', data.username);
                    // Redirect to lobby
                    window.location.href = '/lobby';
                });

                // Handle login failure
                socket.on('loginFailed', function(data) {
                    $('#errorMessage').text(data.message || 'Login failed. Please check your credentials.').removeClass('d-none');
                });
            });
        </script>
    </body>
</html>
