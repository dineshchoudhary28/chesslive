<!DOCTYPE html>
<html lang="en">
    <head>
        {{> head}}
        <title>ChessLive - Register</title>
    </head>
    <body class="bg-gray">
        <div class="container">
            <div class="login-container">
                <div class="card">
                    <div class="card-header">
                        <h2>Register - ChessLive</h2>
                    </div>
                    <div class="card-body">
                        <form id="registerForm">
                            <div class="form-group">
                                <label for="username">Username</label>
                                <input type="text" id="username" class="form-control" required placeholder="Choose a username">
                            </div>
                            <div class="form-group">
                                <label for="email">Email</label>
                                <input type="email" id="email" class="form-control" required placeholder="Enter your email">
                            </div>
                            <div class="form-group">
                                <label for="password">Password</label>
                                <input type="password" id="password" class="form-control" required placeholder="Choose a password">
                            </div>
                            <div class="form-group">
                                <label for="confirmPassword">Confirm Password</label>
                                <input type="password" id="confirmPassword" class="form-control" required placeholder="Confirm your password">
                            </div>
                            <button type="submit" class="btn btn-success btn-block">Register</button>
                        </form>
                        <div class="text-center mt-3">
                            <p>Already have an account? <a href="/">Login here</a></p>
                        </div>
                        <div class="alert alert-danger mt-3 d-none" id="errorMessage"></div>
                        <div class="alert alert-success mt-3 d-none" id="successMessage"></div>
                    </div>
                </div>
            </div>
        </div>

        <script>
            $(document).ready(function() {
                $('#registerForm').on('submit', function(e) {
                    e.preventDefault();
                    
                    const username = $('#username').val().trim();
                    const email = $('#email').val().trim();
                    const password = $('#password').val();
                    const confirmPassword = $('#confirmPassword').val();
                    
                    // Hide previous messages
                    $('#errorMessage, #successMessage').addClass('d-none');
                    
                    // Validation
                    if (!username || !email || !password || !confirmPassword) {
                        $('#errorMessage').text('All fields are required.').removeClass('d-none');
                        return;
                    }
                    
                    if (password !== confirmPassword) {
                        $('#errorMessage').text('Passwords do not match.').removeClass('d-none');
                        return;
                    }
                    
                    if (password.length < 6) {
                        $('#errorMessage').text('Password must be at least 6 characters long.').removeClass('d-none');
                        return;
                    }

                    // Send registration data to server
                    socket.emit('register', { username, email, password });
                });

                // Handle successful registration
                socket.on('registerSuccess', function(data) {
                    $('#successMessage').text('Registration successful! Redirecting to login...').removeClass('d-none');
                    setTimeout(() => {
                        window.location.href = '/';
                    }, 2000);
                });

                // Handle registration failure
                socket.on('registerFailed', function(data) {
                    $('#errorMessage').text(data.message || 'Registration failed. Please try again.').removeClass('d-none');
                });
            });
        </script>
    </body>
</html>
