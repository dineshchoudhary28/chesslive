<!-- front/views/game.html -->
<!DOCTYPE html>
<html lang="en">
    <head>
        {{> head}}
        <title>ChessLive</title>
    </head>
    <body class="bg-gray">
        <div class="container-fluid">
            <div class="row">
                <!-- Chess Board Section -->
                <div class="col-lg-8">
                    <div class="card">
                        <div class="card-header">
                            <div class="row">
                                <div class="col-md-6">
                                    <h2>Chesslive</h2>
                                </div>
                                <div class="col-md-6 text-end">
                                    <span id="gameInfo">Game Code: <span id="gameCode"></span></span>
                                </div>
                            </div>
                        </div>
                        <div class="card-body">
                            <div class="row">
                                <div class="col-md-8">
                                    <div class="board-container">
                                        <div id="myBoard"></div>
                                    </div>
                                </div>
                                <div class="col-md-4">
                                    <div class="game-info">
                                        <div class="status-container">
                                            <div class="player-info">
                                                <span class="playing-as">Playing as: <span id="playerColor">{{color}}</span></span>
                                                <span class="opponent-name" id="opponentName">Waiting for opponent...</span>
                                            </div>
                                            <div class="status-box">
                                                <h4>Status</h4>
                                                <div id="status" class="status"></div>
                                            </div>
                                            <div class="pgn-box">
                                                <h4>Move History</h4>
                                                <div id="pgn" class="pgn"></div>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                
                <!-- Video and Chat Section -->
                <div class="col-lg-4">
                    <div class="row">
                        <!-- Video Call Section -->
                        <div class="col-12 mb-3">
                            <div class="card">
                                <div class="card-header">
                                    <h3>Video Call</h3>
                                </div>
                                <div class="card-body">
                                    <div class="video-container">
                                        <div class="video-wrapper">
                                            <video id="localVideo" autoplay muted></video>
                                            <div class="video-label">You</div>
                                        </div>
                                        <div class="video-wrapper">
                                            <video id="remoteVideo" autoplay></video>
                                            <div class="video-label">Opponent</div>
                                        </div>
                                    </div>
                                    <div class="video-controls mt-2">
                                        <button id="toggleVideo" class="btn btn-primary">Turn Off Video</button>
                                        <button id="toggleAudio" class="btn btn-secondary">Mute Audio</button>
                                    </div>
                                </div>
                            </div>
                        </div>
                        
                        <!-- Chat Section -->
                        <div class="col-12">
                            <div class="card">
                                <div class="card-header">
                                    <h3>Chat</h3>
                                </div>
                                <div class="card-body">
                                    <div id="chatMessages" class="chat-messages"></div>
                                    <div class="chat-input-container">
                                        <input type="text" id="chatInput" class="form-control" placeholder="Type a message...">
                                        <button id="sendMessage" class="btn btn-primary">Send</button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <script>
            // Store player color from server
            let playerColor = '{{color}}';
            
            // Parse game code from URL
            const urlParams = new URLSearchParams(window.location.search);
            const gameCode = urlParams.get('code');
            $('#gameCode').text(gameCode);
            
            // Get username from session storage
            const username = sessionStorage.getItem('username');
            if (!username) {
                window.location.href = '/';
            }
        </script>
        <script src="/public/js/chess-app.js"></script>
    </body>
</html>
